[project]
name = "autonomous-se-platform-backend"
version = "0.2.0"
description = "Backend foundation for an autonomous software engineering platform."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "bandit>=1.7.9",
  "celery[redis]>=5.4.0",
  "fastapi>=0.111.0",
  "gitpython>=3.1.43",
  "httpx>=0.27.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "passlib[bcrypt]>=1.7.4",
  "prometheus-client>=0.20.0",
  "pydantic-settings>=2.4.0",
  "pyjwt>=2.8.0",
  "python-multipart>=0.0.9",
  "radon>=6.0.1",
  "redis>=5.0.7",
  "ruff>=0.5.5",
  "semgrep>=1.80.0",
  "sqlalchemy[asyncio]>=2.0.31",
  "tree-sitter>=0.22.3",
  "uvicorn[standard]>=0.30.3",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0",
  "black>=24.4.2",
  "mypy>=1.11.0",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/models/*" = ["F821", "UP037"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "passlib.*", "git.*"]
ignore_missing_imports = true
